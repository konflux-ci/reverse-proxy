name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '30 7 * * 1-5'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify go.sum is up to date
        run: go mod tidy -diff

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          flags: unit-tests
          files: cover.out
          fail_ci_if_error: false

  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          GOVULNCHECK_VERSION=$(tr -d ' \r\n' < .govulncheck-version)
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -format sarif ./... > govulncheck.sarif || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@b8c54a29e01e42e6df5c5e2a9697f782e4c70745 # v4.1.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
